<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasly — Trusted Help. Elevated Living.</title>
<meta name="description" content="Kasly is a premium on-demand home & lifestyle services platform. Book a verified professional, or apply to become one yourself.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C; --ink-soft:#2B2E3A; --paper:#F6F6F2; --paper-2:#FFFFFF;
    --brass:#AC8850; --brass-light:#D9BE8F; --brass-dark:#8A6A3B;
    --verdant:#233F30; --verdant-light:#3A5C46; --slate:#666A73;
    --line: rgba(246,246,242,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    font-family:'Inter', sans-serif; color:var(--paper); -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{color:inherit; text-decoration:none;}
  h1,h2{font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em;}
  :focus-visible{outline:2px solid var(--brass-light); outline-offset:3px;}

  .top-brand{
    position:fixed; top:28px; left:50%; transform:translateX(-50%); z-index:20;
    display:flex; align-items:center; gap:9px; font-family:'Fraunces', serif; font-size:20px; font-weight:600;
    pointer-events:none;
  }
  .top-brand .dot{width:7px; height:7px; border-radius:50%; background:var(--brass-light); transform:translateY(-7px);}

  .split{
    display:flex; height:100vh; width:100vw;
  }
  @media (max-width:820px){ .split{flex-direction:column;} }

  .panel{
    position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    overflow:hidden; transition:flex 0.5s cubic-bezier(.22,.61,.36,1);
    cursor:pointer;
  }
  .split:hover .panel.dim{flex:0.85;}
  .split:hover .panel:hover{flex:1.15;}
  @media (max-width:820px){
    .panel{min-height:50vh;}
    .split:hover .panel.dim{flex:1;}
    .split:hover .panel:hover{flex:1;}
  }

  .panel-a{background:var(--ink);}
  .panel-b{background:var(--verdant);}

  .panel-content{
    position:relative; z-index:2; text-align:center; padding:40px; max-width:420px;
  }
  .panel-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--brass-light); margin-bottom:18px;
  }
  .panel-content h2{font-size:clamp(28px,4vw,42px); line-height:1.12; color:var(--paper); margin-bottom:16px;}
  .panel-content p{font-size:15px; color:rgba(246,246,242,0.68); margin-bottom:30px; line-height:1.55;}
  .panel-cta{
    display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:14.5px;
    padding:14px 30px; border:1px solid rgba(246,246,242,0.35); border-radius:2px;
    transition:background .25s ease, border-color .25s ease;
  }
  .panel-a .panel-cta:hover, .panel-a:hover .panel-cta{background:var(--brass-dark); border-color:var(--brass-dark);}
  .panel-b .panel-cta:hover, .panel-b:hover .panel-cta{background:rgba(246,246,242,0.14); border-color:var(--paper);}
  .panel-cta svg{width:16px; height:16px; transition:transform .25s ease;}
  .panel:hover .panel-cta svg{transform:translateX(3px);}

  .panel-icon{width:52px; height:52px; margin:0 auto 22px; color:var(--brass-light);}

  .divider{
    position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--line); z-index:5; pointer-events:none;
  }
  @media (max-width:820px){ .divider{display:none;} }

  .or-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10;
    width:56px; height:56px; border-radius:50%; background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.06em; box-shadow:0 8px 30px rgba(0,0,0,0.35); pointer-events:none;
  }
  @media (max-width:820px){ .or-badge{top:50%; left:50%;} }

  .footer-note{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:20;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; color:rgba(246,246,242,0.45);
    pointer-events:none;
  }
</style>
</head>
<body>

  <div class="top-brand" aria-hidden="true">KASLY<span class="dot"></span></div>

  <div class="split">
    <a href="customer-home.html" class="panel panel-a" id="panelA">
      <div class="panel-content">
        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg>
        <div class="panel-eyebrow">I need help</div>
        <h2>Book a service.</h2>
        <p>Cleaning, moving, bartending, and more — verified professionals, booked in minutes.</p>
        <span class="panel-cta">Get started
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </div>
    </a>

    <a href="pro-apply.html" class="panel panel-b" id="panelB">
      <div class="panel-content">
        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <div class="panel-eyebrow">I want to work</div>
        <h2>Become a Pro.</h2>
        <p>Set your own hours, choose your jobs, and get paid weekly or cash out instantly.</p>
        <span class="panel-cta">Apply now
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </div>
    </a>
  </div>

  <div class="divider"></div>
  <div class="or-badge">OR</div>

  <div class="footer-note">TRUSTED HELP · ELEVATED LIVING</div>

<script>
  const panelA = document.getElementById('panelA');
  const panelB = document.getElementById('panelB');
  panelA.addEventListener('mouseenter', () => panelB.classList.add('dim'));
  panelA.addEventListener('mouseleave', () => panelB.classList.remove('dim'));
  panelB.addEventListener('mouseenter', () => panelA.classList.add('dim'));
  panelB.addEventListener('mouseleave', () => panelA.classList.remove('dim'));
</script>

</body>
</html>
