<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service — Kasly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C; --ink-soft:#2B2E3A; --mist:#EAEAE5; --paper:#F6F6F2; --paper-2:#FFFFFF;
    --brass:#AC8850; --brass-light:#D9BE8F; --brass-dark:#8A6A3B;
    --verdant:#233F30; --slate:#666A73; --line: rgba(18,20,28,0.12); --line-soft: rgba(18,20,28,0.07);
    --shadow: 0 20px 60px -20px rgba(18,20,28,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:900px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass-dark); display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:''; width:22px; height:1px; background:var(--brass);}
  :focus-visible{outline:2px solid var(--brass-dark); outline-offset:3px;}

  header{position:sticky; top:0; z-index:100; background:rgba(246,246,242,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft);}
  nav{display:flex; align-items:center; justify-content:space-between; height:74px;}
  .logo{display:flex; align-items:center; gap:9px; font-family:'Fraunces', serif; font-size:20px; font-weight:600;}
  .logo .dot{width:7px; height:7px; border-radius:50%; background:var(--brass); transform:translateY(-7px);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:14.5px; padding:13px 26px; border-radius:2px; cursor:pointer; border:1px solid transparent; transition:background .2s ease, border-color .2s ease, opacity .2s ease;}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{background:var(--brass-dark);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-ghost{border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}

  main{padding:64px 0 100px;}
  .service-head{margin-bottom:40px;}
  .service-head h1{font-size:clamp(32px,4.6vw,46px); margin-top:14px;}
  .service-head p{color:var(--slate); font-size:16px; margin-top:12px; max-width:520px;}

  .booking-card{background:var(--paper-2); border:1px solid var(--line); box-shadow:var(--shadow); padding:36px;}
  @media (max-width:560px){ .booking-card{padding:26px 22px;} }

  .field{margin-bottom:24px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:10px;}
  .hour-control{display:flex; align-items:center; gap:16px;}
  .hour-btn{width:40px; height:40px; border:1px solid var(--line); background:var(--paper); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .2s ease;}
  .hour-btn:hover{border-color:var(--ink);}
  .hour-value{font-family:'Fraunces', serif; font-size:26px; min-width:90px; text-align:center;}
  .hour-value span{font-size:14px; color:var(--slate); font-family:'Inter';}

  .flat-note{font-size:14px; color:var(--slate); background:var(--mist); padding:16px 18px;}

  .breakdown{border-top:1px solid var(--line-soft); margin-top:8px; padding-top:20px;}
  .breakdown-row{display:flex; justify-content:space-between; font-size:14px; padding:6px 0; color:var(--slate);}
  .breakdown-row.discount{color:var(--verdant); font-weight:600;}
  .breakdown-row.total{border-top:1px solid var(--line); margin-top:8px; padding-top:14px; font-family:'Fraunces', serif; font-size:22px; color:var(--ink);}

  .license-note{display:flex; gap:10px; align-items:flex-start; background:rgba(172,136,80,0.1); border:1px solid rgba(172,136,80,0.3); padding:14px 16px; font-size:13px; color:var(--brass-dark); margin-top:20px;}
  .license-note svg{width:16px; height:16px; flex-shrink:0; margin-top:1px;}

  .cta-row{margin-top:28px; display:flex; gap:14px; flex-wrap:wrap;}

  footer{padding:32px 0; text-align:center; font-size:12.5px; color:var(--slate); border-top:1px solid var(--line-soft); margin-top:60px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a href="index.html" class="logo">KASLY<span class="dot"></span></a>
      <a href="services.html" class="btn btn-ghost">← All services</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="service-head">
      <div class="eyebrow" id="eyebrow">Book a service</div>
      <h1 id="service-name">Loading…</h1>
      <p id="service-desc"></p>
    </div>

    <div class="booking-card">
      <div id="hourly-section" class="field" style="display:none;">
        <label>How many hours?</label>
        <div class="hour-control">
          <button class="hour-btn" id="minus" type="button" aria-label="Decrease hours">−</button>
          <div class="hour-value"><span id="hour-num">2</span> <span>hrs</span></div>
          <button class="hour-btn" id="plus" type="button" aria-label="Increase hours">+</button>
        </div>
      </div>

      <div id="flat-section" style="display:none;">
        <div class="flat-note" id="flat-note"></div>
      </div>

      <div class="breakdown">
        <div class="breakdown-row" id="row-rate"></div>
        <div class="breakdown-row discount" id="row-discount" style="display:none;"></div>
        <div class="breakdown-row total" id="row-total"></div>
      </div>

      <div class="license-note" id="license-note" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <span>Bartending requires the assigned Professional to hold a valid alcohol-service license — Kasly verifies this before assignment.</span>
      </div>

      <div class="cta-row">
        <a href="#" id="continue-btn" class="btn btn-primary">Continue to payment</a>
        <a href="book-service.html" class="btn btn-ghost">How booking works</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">© 2026 Kasly, Inc. · Illinois · California</div>
</footer>

<script>
  const SERVICES = {
    "house-cleaning": { name: "House Cleaning", desc: "Regular upkeep for a consistently spotless home.", rate: 35, unit: "hour" },
    "deep-cleaning": { name: "Deep Cleaning", desc: "A thorough, top-to-bottom reset for every room.", rate: 45, unit: "hour" },
    "moving-assistance": { name: "Moving Assistance", desc: "Extra hands for loading, unloading, and heavy lifting.", rate: 40, unit: "hour" },
    "furniture-assembly": { name: "Furniture Assembly", desc: "Flat-pack to full sets, built right the first time.", rate: 30, unit: "hour" },
    "tv-mounting": { name: "TV Mounting", desc: "Secure, level mounting — cables tidied, no fuss.", rate: 60, unit: "flat" },
    "lawn-care": { name: "Lawn Care", desc: "Mowing, edging, and upkeep for a sharp-looking yard.", rate: 35, unit: "hour" },
    "bartending": { name: "Bartending", desc: "Licensed bartenders for parties and private events.", rate: 55, unit: "hour", license: true },
    "event-staffing": { name: "Event Staffing", desc: "Reliable staff for weddings, corporate events, and more.", rate: 30, unit: "hour" },
    "instant-helper": { name: "Instant Helper", desc: "On-demand help for the task that can't wait.", rate: 30, unit: "hour" }
  };

  const params = new URLSearchParams(window.location.search);
  const slug = SERVICES[params.get("service")] ? params.get("service") : "house-cleaning";
  const service = SERVICES[slug];

  document.getElementById("eyebrow").textContent = service.unit === "flat" ? "Book a service · Flat rate" : "Book a service · Hourly";
  document.getElementById("service-name").textContent = service.name;
  document.getElementById("service-desc").textContent = service.desc;
  document.title = service.name + " — Kasly";

  let hours = 2;
  const MIN_HOURS = 1, MAX_HOURS = 12;
  const DISCOUNT_THRESHOLD = 2; // hours
  const DISCOUNT_RATE = 0.05; // 5%

  function formatMoney(n){ return "$" + n.toFixed(2); }

  function render(){
    const rowRate = document.getElementById("row-rate");
    const rowDiscount = document.getElementById("row-discount");
    const rowTotal = document.getElementById("row-total");

    if (service.unit === "flat") {
      document.getElementById("flat-section").style.display = "block";
      document.getElementById("flat-note").textContent = service.name + " is a flat-rate service — no hourly calculation needed.";
      rowRate.innerHTML = "<span>Flat rate</span><span>" + formatMoney(service.rate) + "</span>";
      rowDiscount.style.display = "none";
      rowTotal.innerHTML = "<span>Total</span><span>" + formatMoney(service.rate) + "</span>";
    } else {
      document.getElementById("hourly-section").style.display = "block";
      document.getElementById("hour-num").textContent = hours;

      const subtotal = service.rate * hours;
      const applyDiscount = hours > DISCOUNT_THRESHOLD;
      const discountAmount = applyDiscount ? subtotal * DISCOUNT_RATE : 0;
      const total = subtotal - discountAmount;

      rowRate.innerHTML = "<span>" + formatMoney(service.rate) + "/hr × " + hours + " hrs</span><span>" + formatMoney(subtotal) + "</span>";

      if (applyDiscount) {
        rowDiscount.style.display = "flex";
        rowDiscount.innerHTML = "<span>5% discount (bookings over 2 hrs)</span><span>−" + formatMoney(discountAmount) + "</span>";
      } else {
        rowDiscount.style.display = "none";
      }

      rowTotal.innerHTML = "<span>Total</span><span>" + formatMoney(total) + "</span>";

      window._kaslyTotal = total;
    }

    if (service.license) {
      document.getElementById("license-note").style.display = "flex";
    }

    const totalForLink = service.unit === "flat" ? service.rate : (window._kaslyTotal || service.rate * hours);
    document.getElementById("continue-btn").href =
      "payment.html?service=" + encodeURIComponent(slug) +
      "&name=" + encodeURIComponent(service.name) +
      "&hours=" + (service.unit === "flat" ? "flat" : hours) +
      "&total=" + totalForLink.toFixed(2);
  }

  document.getElementById("minus").addEventListener("click", () => {
    if (hours > MIN_HOURS) { hours--; render(); }
  });
  document.getElementById("plus").addEventListener("click", () => {
    if (hours < MAX_HOURS) { hours++; render(); }
  });

  render();
</script>

</body>
</html>
